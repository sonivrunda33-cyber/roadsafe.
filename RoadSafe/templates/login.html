{% extends "base.html" %}

{% block title %}
RoadSafe | Login
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🚦
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your RoadSafe account.
        </p>


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </p>

    </div>

</section>

{% endblock %}
